name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q etisalat_simple.zip
          sed -i "s#import 'package:intl/intl.dart';#import 'package:intl/intl.dart' show DateFormat, NumberFormat;#" etisalat_simple/lib/core/extensions.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: etisalat_simple
        run: |
          flutter create . --platforms android --org com.example
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: etisalat_simple/build/app/outputs/flutter-apk/app-release.apk
